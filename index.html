<script>
  const data = JSON.parse(document.getElementById('swipe-data').textContent);
  const select = document.getElementById('companySelect');
  const search = document.getElementById('companySearch');
  const clear = document.getElementById('clearSearch');
  const summary = document.getElementById('summary');
  const cards = document.getElementById('cards');
  function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
  function adsFor(company) { return data.ads.filter(ad => ad.company === company && !ad.placeholder).slice(0, 10); }
  function companyMeta(name) { return data.companies.find(company => company.name === name) || { name, rank: '', reviews: '', rating: '' }; }
  function populateOptions(filter = '') {
    const query = filter.trim().toLowerCase();
    const previous = select.value;
    const matching = data.companies.filter(company => company.name.toLowerCase().includes(query));
    select.innerHTML = matching.map(company => {
      const count = adsFor(company.name).length;
      const label = '#' + company.rank + ' - ' + company.name + ' (' + count + ' ads)';
      return '<option value="' + escapeHtml(company.name) + '">' + escapeHtml(label) + '</option>';
    }).join('');
    if (matching.some(company => company.name === previous)) select.value = previous;
    render();
  }
  function render() {
    const company = select.value;
    const meta = companyMeta(company);
    const ads = adsFor(company);
    summary.innerHTML = '<strong>' + escapeHtml(company || 'No company selected') + '</strong>' + (company ? ' Â· Google review rank #' + escapeHtml(meta.rank) + ' Â· ' + escapeHtml(meta.reviews) + ' Google reviews Â· ' + escapeHtml(meta.rating || 'n/a') + ' rating Â· ' + ads.length + ' collected ad' + (ads.length === 1 ? '' : 's') : '');
    if (!company) { cards.innerHTML = '<div class="empty">No matching company in the dropdown.</div>'; return; }
    if (!ads.length) { cards.innerHTML = '<div class="empty">No active Ads Library matches have been collected for this company yet.</div>'; return; }
    cards.innerHTML = ads.map((ad, index) => {
      const image = ad.screenshot ? '<div class="shot"><img src="' + escapeHtml(ad.screenshot) + '" alt="Ad screenshot for ' + escapeHtml(ad.company) + '"></div>' : '<div class="shot">Screenshot unavailable<br><a href="' + escapeHtml(ad.adLink) + '" target="_blank" rel="noopener">Open ad link</a></div>';
      return '<article class="card">' + image + '<div class="body"><h2>' + (index + 1) + '. ' + escapeHtml(ad.company) + '</h2><div class="meta"><strong>Advertiser:</strong> ' + escapeHtml(ad.advertiser || 'Not shown') + '</div><div class="meta"><strong>Rank within company:</strong> ' + escapeHtml(ad.rankWithinCompany || index + 1) + '</div><div class="meta"><strong>Library ID:</strong> ' + escapeHtml(ad.libraryId) + '</div><div class="meta"><strong>Started:</strong> ' + escapeHtml(ad.started || 'Not shown') + '</div><div class="meta"><a href="' + escapeHtml(ad.adLink) + '" target="_blank" rel="noopener">Open ad in Facebook Ads Library</a></div><div class="copy">' + escapeHtml(ad.copy || 'No visible primary ad copy found on the Ads Library detail page.') + '</div></div></article>';
    }).join('');
  }
  search.addEventListener('input', () => populateOptions(search.value));
  select.addEventListener('change', render);
  clear.addEventListener('click', () => { search.value = ''; populateOptions(''); select.focus(); });
  populateOptions('');
</script>
